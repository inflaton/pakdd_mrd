[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pakdd-mrd"
version = "0.1.0"
description = "Selective entity resolution over retrieved candidate sets"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "requests>=2.31",
  "bm25s>=0.2.5",
  "matplotlib>=3.8",
  "rich>=13.0",
]

[project.optional-dependencies]
# GPU/model stack. On DGX Spark install torch first (see env/setup_spark.sh), then this extra.
models = [
  "transformers>=4.46",
  "accelerate>=1.0",
  "peft>=0.13",
  "sentence-transformers>=3.2",
  "safetensors>=0.4",
  "openai>=1.50",
  "httpx>=0.27",
  "sentencepiece>=0.2",   # deberta-v3 ships only spm.model; the fast tokenizer is converted from it
  "protobuf>=4.25",       # needed by the sentencepiece -> fast tokenizer converter
]
dev = ["pytest>=8.0", "ruff>=0.6"]
# result notebooks (notebooks/0*.ipynb) and their builder (notebooks/build_notebooks.py)
notebooks = ["nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7.16", "ipykernel>=6.29", "jupyterlab>=4.2", "tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
