# Public sources (plan §5, R14-R16). Files are fetched from the original maintainers and SHA-256 pinned on
# first download into data/sigir/public/_pins/<dataset>.json. Verify URLs against the maintainer pages
# before the first run; if a URL has moved, update it here and record the change in the construction manifest.
#
# identity_policy is the frozen domain rule used in prompts and annotation (plan §4, §5).
# link_completeness: complete | positives_complete | cluster  (see src/sigir/data/sources.py)

raw_dir: data/sigir/public/raw
pins_dir: data/sigir/public/_pins

datasets:
  - name: walmart_amazon
    format: deepmatcher
    base_url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/Walmart-Amazon/exp_data/
    files:
      - {name: tableA.csv, url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/Walmart-Amazon/exp_data/tableA.csv}
      - {name: tableB.csv, url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/Walmart-Amazon/exp_data/tableB.csv}
      - {name: train.csv,  url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/Walmart-Amazon/exp_data/train.csv}
      - {name: valid.csv,  url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/Walmart-Amazon/exp_data/valid.csv}
      - {name: test.csv,   url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/Walmart-Amazon/exp_data/test.csv}
      # raw archive: only for mapping the earlier study's reserved custom_id to exp_data ids (title check)
      - {name: walmart_amazon_raw_data.zip, url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/Walmart-Amazon/walmart_amazon_raw_data.zip}
    fields: [title, category, brand, modelno, price]
    compact_fields: [title, brand, modelno]
    link_completeness: positives_complete   # released negatives are sampled; unlisted pair != verified negative
    identity_policy: >
      Two records match when they describe the same product model from the same brand. Different colour,
      capacity, pack size or model number variants are different products. Accessories or bundles containing
      the product are not the product.
    redistribution: "Magellan/DeepMatcher data; check pages.cs.wisc.edu/~anhai terms before redistribution."
    legacy_exposure:   # Public row IDs from an earlier evaluation. Required when configured.
      file: data/sigir/public/legacy/walmart-amazon-reservation.json
      archive: walmart_amazon_raw_data.zip            # sha256 must equal the reservation's config.archive_sha256
      raw_table_a: walmart_amazon_raw_data/tableA.csv # custom_id + title, relative to raw/walmart_amazon/
      exposed_splits: [test, dev]                     # Earlier test and dev queries (1,100); 'unused' (1,454) stays eligible
      id_offset: -1                                   # raw custom_id is 1-based; exp_data id is 0-based
    directions: ["A->B", "B->A"]
    direction_weights: {"A->B": 1.0, "B->A": 0.25}   # frozen so the large reverse population does not dominate

  - name: abt_buy
    format: leipzig
    files:
      - {name: Abt-Buy.zip, url: https://dbs.uni-leipzig.de/files/datasets/Abt-Buy.zip}
    leipzig:
      table_a: Abt.csv
      table_b: Buy.csv
      mapping: abt_buy_perfectMapping.csv
      id_a: id
      id_b: id
      map_a: idAbt
      map_b: idBuy
      encoding: latin-1
    fields_a: [name, description, price]
    fields_b: [name, description, manufacturer, price]
    compact_fields: [name, manufacturer]
    link_completeness: complete
    identity_policy: >
      Two records match when they are the same product model (same manufacturer part/model). Variants that
      differ in colour, size or bundle are different products.
    redistribution: "Leipzig DB group benchmark; cite the maintainers; check terms."
    directions: ["A->B", "B->A"]
    direction_weights: {"A->B": 1.0, "B->A": 1.0}

  - name: dblp_scholar
    format: leipzig
    files:
      - {name: DBLP-Scholar.zip, url: https://dbs.uni-leipzig.de/files/datasets/DBLP-Scholar.zip}
    leipzig:
      table_a: DBLP1.csv
      table_b: Scholar.csv
      mapping: DBLP-Scholar_perfectMapping.csv
      id_a: id
      id_b: id
      map_a: idDBLP
      map_b: idScholar
      encoding: latin-1          # DBLP1.csv and the mapping
      encoding_b: utf-8-sig      # Scholar.csv is UTF-8 with a BOM (checked Nov 2)
    fields_a: [title, authors, venue, year]
    fields_b: [title, authors, venue, year]
    compact_fields: [title, year]
    link_completeness: complete
    # Identity policy, drafted 4 Nov 2026 for the freeze. Acceptable sets come from the perfect mapping link by
    # link: a DBLP query accepts exactly the Scholar records the mapping links to it (2.2 on average, up to 20;
    # 51% of DBLP records have two or more). 125 Scholar records are linked to two or more DBLP records, mostly a
    # conference paper and its journal version (e.g. Aurora: SIGMOD 2003 and VLDB J. 2003); such a record is
    # acceptable for each linked DBLP query. Union-find merges those DBLP records into one entity group (50 groups
    # with 2 DBLP records, 3 with 3-4), which keeps both versions on one side of every split. The largest group
    # (37 records) joins two Agrawal-Srikant papers through shared Scholar citation entries.
    identity_policy: >
      Two records match when they refer to the same publication. Google Scholar often holds several records for
      one publication, including citation entries with shortened, misspelt or run-together titles, abbreviated
      author lists, or a missing venue or year; every such record matches. A preprint, a conference paper and an
      extended journal version are different publications, but a Scholar record that does not distinguish them
      may match either.
    redistribution: "Leipzig DB group benchmark; cite the maintainers; check terms."
    directions: ["A->B"]
    direction_weights: {"A->B": 1.0}

  - name: wdc_products
    format: wdc_products
    # Verified 3 Nov 2026 against https://webdatacommons.org/largescaleproductcorpus/wdc-products/: the pairwise
    # release is one archive, 80pair.zip (22 MB), whose members are the wdcproducts80cc20rnd000un_* json.gz files.
    # Use ONE published variant for the primary benchmark and evaluate other variants only under their own
    # protocol. Do not merge overlapping variants. The primary is 80cc20rnd000un, small: 80% corner-case and 20%
    # random pairs, 0% unseen products, small training size. "Unseen" refers to WDC's own train/test split; this
    # benchmark pools the variant's train_small, valid_small and gs offers and re-splits them by entity group, so
    # no test entity is in train here (exposure audit). The archive also holds 050un and 100un gold sets.
    files:
      - {name: 80pair.zip, url: https://data.dws.informatik.uni-mannheim.de/largescaleproductcorpus/data/wdc-products/80pair.zip}
    members:   # read from raw/wdc_products/80pair/ after extraction
      - wdcproducts80cc20rnd000un_train_small.json.gz
      - wdcproducts80cc20rnd000un_valid_small.json.gz
      - wdcproducts80cc20rnd000un_gs.json.gz
    fields: [title, description, brand, price, priceCurrency]
    compact_fields: [title, brand]
    link_completeness: cluster
    identity_policy: >
      Two offers match when they are the same product (same manufacturer product id / model) as defined by the
      WDC product cluster. Different variants (size, colour, capacity) are different products.
    redistribution: "WDC Products (CC-BY style web data); cite WDC; check terms."
    directions: ["A->B"]   # single table; roles assigned deterministically per split
    direction_weights: {"A->B": 1.0}
    role_seed: 20261101
